<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tensor shape ledger</title><desc id="desc">A shape trace from IDs through embeddings and attention to vocabulary logits, including attention score dimensions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24364b"/></marker>
    <style>
      .bg{fill:#fbfcfe} .box{fill:#eef4fb;stroke:#315a84;stroke-width:2} .accent{fill:#e8f6ef;stroke:#28755a;stroke-width:2}
      .warm{fill:#fff3e4;stroke:#9a5c13;stroke-width:2} .muted{fill:#f4f1f8;stroke:#6a5681;stroke-width:2}
      .line{fill:none;stroke:#24364b;stroke-width:2.4;marker-end:url(#arrow)} .dash{fill:none;stroke:#56697d;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .title{font:700 30px system-ui,sans-serif;fill:#172536} .label{font:600 19px system-ui,sans-serif;fill:#172536} .small{font:16px system-ui,sans-serif;fill:#33475b}
      .tiny{font:14px ui-monospace,monospace;fill:#33475b} .math{font:17px ui-monospace,monospace;fill:#172536} .note{font:italic 15px system-ui,sans-serif;fill:#56697d}
    </style>
  </defs><rect class="bg" width="1200" height="675"/><text class="title" x="56" y="55">Tensor shape ledger</text>
<rect class="warm" x="55" y="150" width="170" height="100" rx="12"/><text class="label" x="140.0" y="181" text-anchor="middle">IDs</text><text class="tiny" x="140.0" y="207" text-anchor="middle">[B,T]</text>
<path class="line" d="M225 200 L270 200"/>
<rect class="box" x="270" y="150" width="190" height="100" rx="12"/><text class="label" x="365.0" y="181" text-anchor="middle">Embedding</text><text class="tiny" x="365.0" y="207" text-anchor="middle">[V,D] lookup</text>
<path class="line" d="M460 200 L510 200"/>
<rect class="accent" x="510" y="150" width="180" height="100" rx="12"/><text class="label" x="600.0" y="181" text-anchor="middle">Hidden</text><text class="tiny" x="600.0" y="207" text-anchor="middle">[B,T,D]</text>
<path class="line" d="M690 200 L745 200"/>
<rect class="box" x="745" y="150" width="180" height="100" rx="12"/><text class="label" x="835.0" y="181" text-anchor="middle">Projection</text><text class="tiny" x="835.0" y="207" text-anchor="middle">[D,V]</text>
<path class="line" d="M925 200 L975 200"/>
<rect class="warm" x="975" y="150" width="170" height="100" rx="12"/><text class="label" x="1060.0" y="181" text-anchor="middle">Logits</text><text class="tiny" x="1060.0" y="207" text-anchor="middle">[B,T,V]</text>
<rect class="box" x="130" y="355" width="220" height="100" rx="12"/><text class="label" x="240.0" y="386" text-anchor="middle">Q, K, V</text><text class="tiny" x="240.0" y="412" text-anchor="middle">[B,H,T,dₕ]</text>
<rect class="warm" x="490" y="355" width="220" height="100" rx="12"/><text class="label" x="600.0" y="386" text-anchor="middle">Scores</text><text class="tiny" x="600.0" y="412" text-anchor="middle">[B,H,T,T]</text>
<rect class="accent" x="850" y="355" width="220" height="100" rx="12"/><text class="label" x="960.0" y="386" text-anchor="middle">Head output</text><text class="tiny" x="960.0" y="412" text-anchor="middle">[B,H,T,dₕ]</text>
<path class="line" d="M350 405 L490 405"/>
<path class="line" d="M710 405 L850 405"/>
<text class="small" x="420" y="385" text-anchor="middle">QKᵀ</text>
<text class="small" x="780" y="385" text-anchor="middle">softmax · V</text>
<text class="math" x="600" y="520" text-anchor="middle">D = H·dₕ; payload bytes = element count × bytes/element</text>
<text class="note" x="600" y="646" text-anchor="middle">Preserve the outer [B,T,D] shape across a Transformer block; internal tensors differ.</text>
</svg>
