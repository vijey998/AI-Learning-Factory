<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Inference serving request path</title><desc id="desc">A request passes through gateway, scheduler, worker, KV allocator, runtime, metrics, and token streaming.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24364b"/></marker>
    <style>
      .bg{fill:#fbfcfe} .box{fill:#eef4fb;stroke:#315a84;stroke-width:2} .accent{fill:#e8f6ef;stroke:#28755a;stroke-width:2}
      .warm{fill:#fff3e4;stroke:#9a5c13;stroke-width:2} .muted{fill:#f4f1f8;stroke:#6a5681;stroke-width:2}
      .line{fill:none;stroke:#24364b;stroke-width:2.4;marker-end:url(#arrow)} .dash{fill:none;stroke:#56697d;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .title{font:700 30px system-ui,sans-serif;fill:#172536} .label{font:600 19px system-ui,sans-serif;fill:#172536} .small{font:16px system-ui,sans-serif;fill:#33475b}
      .tiny{font:14px ui-monospace,monospace;fill:#33475b} .math{font:17px ui-monospace,monospace;fill:#172536} .note{font:italic 15px system-ui,sans-serif;fill:#56697d}
    </style>
  </defs><rect class="bg" width="1200" height="675"/><text class="title" x="56" y="55">Inference serving request path</text>
<rect class="warm" x="55" y="120" width="170" height="90" rx="12"/><text class="label" x="140.0" y="151" text-anchor="middle">Client</text><text class="tiny" x="140.0" y="177" text-anchor="middle">HTTP / stream</text>
<rect class="box" x="285" y="120" width="190" height="90" rx="12"/><text class="label" x="380.0" y="151" text-anchor="middle">Gateway</text><text class="tiny" x="380.0" y="177" text-anchor="middle">auth + limits</text>
<rect class="accent" x="535" y="120" width="190" height="90" rx="12"/><text class="label" x="630.0" y="151" text-anchor="middle">Scheduler</text><text class="tiny" x="630.0" y="177" text-anchor="middle">admit + batch</text>
<rect class="muted" x="785" y="120" width="170" height="90" rx="12"/><text class="label" x="870.0" y="151" text-anchor="middle">Worker</text><text class="tiny" x="870.0" y="177" text-anchor="middle">prefill/decode</text>
<rect class="warm" x="1015" y="120" width="140" height="90" rx="12"/><text class="label" x="1085.0" y="151" text-anchor="middle">Stream</text><text class="tiny" x="1085.0" y="177" text-anchor="middle">tokens</text>
<path class="line" d="M225 165 L285 165"/>
<path class="line" d="M475 165 L535 165"/>
<path class="line" d="M725 165 L785 165"/>
<path class="line" d="M955 165 L1015 165"/>
<rect class="box" x="535" y="340" width="190" height="90" rx="12"/><text class="label" x="630.0" y="371" text-anchor="middle">KV allocator</text><text class="tiny" x="630.0" y="397" text-anchor="middle">pages + refs</text>
<rect class="accent" x="785" y="340" width="170" height="90" rx="12"/><text class="label" x="870.0" y="371" text-anchor="middle">Model + runtime</text><text class="tiny" x="870.0" y="397" text-anchor="middle">weights + kernels</text>
<rect class="muted" x="285" y="340" width="190" height="90" rx="12"/><text class="label" x="380.0" y="371" text-anchor="middle">Metrics</text><text class="tiny" x="380.0" y="397" text-anchor="middle">queue/TTFT/TPOT</text>
<path class="line" d="M630 210 L630 340"/>
<path class="line" d="M725 385 L785 385"/>
<path class="line" d="M870 340 L870 210"/>
<path class="line" d="M535 385 L475 385"/>
<text class="math" x="600" y="505" text-anchor="middle">completion = queue + prefill + decode + stream overhead</text>
<text class="small" x="600" y="545" text-anchor="middle">Cancellation must free KV pages and stop downstream work</text>
<text class="note" x="600" y="646" text-anchor="middle">Throughput and user latency depend on scheduling as well as kernel speed.</text>
</svg>
