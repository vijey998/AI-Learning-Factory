<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval-augmented generation pipeline</title><desc id="desc">A RAG system retrieves authorized chunks, reranks and packs evidence, then generates a cited answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24364b"/></marker>
    <style>
      .bg{fill:#fbfcfe} .box{fill:#eef4fb;stroke:#315a84;stroke-width:2} .accent{fill:#e8f6ef;stroke:#28755a;stroke-width:2}
      .warm{fill:#fff3e4;stroke:#9a5c13;stroke-width:2} .muted{fill:#f4f1f8;stroke:#6a5681;stroke-width:2}
      .line{fill:none;stroke:#24364b;stroke-width:2.4;marker-end:url(#arrow)} .dash{fill:none;stroke:#56697d;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .title{font:700 30px system-ui,sans-serif;fill:#172536} .label{font:600 19px system-ui,sans-serif;fill:#172536} .small{font:16px system-ui,sans-serif;fill:#33475b}
      .tiny{font:14px ui-monospace,monospace;fill:#33475b} .math{font:17px ui-monospace,monospace;fill:#172536} .note{font:italic 15px system-ui,sans-serif;fill:#56697d}
    </style>
  </defs><rect class="bg" width="1200" height="675"/><text class="title" x="56" y="55">Retrieval-augmented generation pipeline</text>
<rect class="warm" x="50" y="115" width="180" height="85" rx="12"/><text class="label" x="140.0" y="146" text-anchor="middle">Question</text><text class="tiny" x="140.0" y="172" text-anchor="middle">user intent</text>
<rect class="box" x="285" y="115" width="200" height="85" rx="12"/><text class="label" x="385.0" y="146" text-anchor="middle">Query embedding</text><text class="tiny" x="385.0" y="172" text-anchor="middle">vector [D]</text>
<rect class="accent" x="540" y="115" width="200" height="85" rx="12"/><text class="label" x="640.0" y="146" text-anchor="middle">Retriever</text><text class="tiny" x="640.0" y="172" text-anchor="middle">top-k chunks</text>
<rect class="muted" x="795" y="115" width="175" height="85" rx="12"/><text class="label" x="882.5" y="146" text-anchor="middle">Reranker</text><text class="tiny" x="882.5" y="172" text-anchor="middle">ordered evidence</text>
<rect class="warm" x="1025" y="115" width="140" height="85" rx="12"/><text class="label" x="1095.0" y="146" text-anchor="middle">Prompt</text><text class="tiny" x="1095.0" y="172" text-anchor="middle">packed context</text>
<path class="line" d="M230 157 L285 157"/>
<path class="line" d="M485 157 L540 157"/>
<path class="line" d="M740 157 L795 157"/>
<path class="line" d="M970 157 L1025 157"/>
<rect class="box" x="540" y="330" width="200" height="90" rx="12"/><text class="label" x="640.0" y="361" text-anchor="middle">Vector index</text><text class="tiny" x="640.0" y="387" text-anchor="middle">IDs + vectors</text>
<path class="line" d="M640 330 L640 200"/>
<rect class="accent" x="795" y="330" width="175" height="90" rx="12"/><text class="label" x="882.5" y="361" text-anchor="middle">Source store</text><text class="tiny" x="882.5" y="387" text-anchor="middle">text + ACL + URI</text>
<path class="line" d="M882 330 L882 200"/>
<rect class="muted" x="1025" y="330" width="140" height="90" rx="12"/><text class="label" x="1095.0" y="361" text-anchor="middle">Generator</text><text class="tiny" x="1095.0" y="387" text-anchor="middle">answer + cites</text>
<path class="line" d="M1095 200 L1095 330"/>
<text class="math" x="600" y="490" text-anchor="middle">Retrieve → authorize → rerank → pack → generate → verify citations</text>
<text class="small" x="600" y="530" text-anchor="middle">Grounding requires entailment from the cited source, not merely retrieved context</text>
<text class="note" x="600" y="646" text-anchor="middle">Evaluate retrieval recall, answer correctness, citation support, abstention, and latency separately.</text>
</svg>
