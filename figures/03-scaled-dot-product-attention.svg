<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Scaled dot-product attention</title><desc id="desc">Queries and keys form scaled, causally masked scores whose softmax weights retrieve values.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24364b"/></marker>
    <style>
      .bg{fill:#fbfcfe} .box{fill:#eef4fb;stroke:#315a84;stroke-width:2} .accent{fill:#e8f6ef;stroke:#28755a;stroke-width:2}
      .warm{fill:#fff3e4;stroke:#9a5c13;stroke-width:2} .muted{fill:#f4f1f8;stroke:#6a5681;stroke-width:2}
      .line{fill:none;stroke:#24364b;stroke-width:2.4;marker-end:url(#arrow)} .dash{fill:none;stroke:#56697d;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .title{font:700 30px system-ui,sans-serif;fill:#172536} .label{font:600 19px system-ui,sans-serif;fill:#172536} .small{font:16px system-ui,sans-serif;fill:#33475b}
      .tiny{font:14px ui-monospace,monospace;fill:#33475b} .math{font:17px ui-monospace,monospace;fill:#172536} .note{font:italic 15px system-ui,sans-serif;fill:#56697d}
    </style>
  </defs><rect class="bg" width="1200" height="675"/><text class="title" x="56" y="55">Scaled dot-product attention</text>
<rect class="accent" x="55" y="135" width="190" height="95" rx="12"/><text class="label" x="150.0" y="166" text-anchor="middle">Input X</text><text class="tiny" x="150.0" y="192" text-anchor="middle">[B,T,D]</text>
<rect class="box" x="325" y="115" width="190" height="75" rx="12"/><text class="label" x="420.0" y="146" text-anchor="middle">Q = XWQ</text><text class="tiny" x="420.0" y="172" text-anchor="middle">[B,H,T,dₕ]</text>
<rect class="box" x="325" y="215" width="190" height="75" rx="12"/><text class="label" x="420.0" y="246" text-anchor="middle">K = XWK</text><text class="tiny" x="420.0" y="272" text-anchor="middle">[B,H,T,dₕ]</text>
<rect class="box" x="325" y="315" width="190" height="75" rx="12"/><text class="label" x="420.0" y="346" text-anchor="middle">V = XWV</text><text class="tiny" x="420.0" y="372" text-anchor="middle">[B,H,T,dᵥ]</text>
<rect class="warm" x="590" y="165" width="220" height="100" rx="12"/><text class="label" x="700.0" y="196" text-anchor="middle">Scaled scores</text><text class="tiny" x="700.0" y="222" text-anchor="middle">QKᵀ / √dₕ</text><text class="tiny" x="700.0" y="243" text-anchor="middle">[B,H,T,T]</text>
<rect class="muted" x="590" y="330" width="220" height="100" rx="12"/><text class="label" x="700.0" y="361" text-anchor="middle">Masked softmax</text><text class="tiny" x="700.0" y="387" text-anchor="middle">future → −∞</text>
<rect class="box" x="895" y="245" width="240" height="105" rx="12"/><text class="label" x="1015.0" y="276" text-anchor="middle">Weighted values</text><text class="tiny" x="1015.0" y="302" text-anchor="middle">A·V</text><text class="tiny" x="1015.0" y="323" text-anchor="middle">[B,H,T,dᵥ]</text>
<path class="line" d="M245 182 L325 152"/>
<path class="line" d="M245 182 L325 252"/>
<path class="line" d="M245 182 L325 352"/>
<path class="line" d="M515 152 L590 205"/>
<path class="line" d="M515 252 L590 215"/>
<path class="line" d="M700 265 L700 330"/>
<path class="line" d="M810 380 L895 315"/>
<path class="line" d="M515 352 L895 300"/>
<text class="math" x="700" y="475" text-anchor="middle">Aᵢⱼ = 0 for j &gt; i (causal mask)</text>
<text class="math" x="700" y="510" text-anchor="middle">Each row of A sums to 1</text>
<text class="note" x="600" y="646" text-anchor="middle">Scaling keeps score variance controlled when dₕ grows.</text>
</svg>
